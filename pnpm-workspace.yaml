# Keep schema types crossing DSH package boundaries on one Zod copy.
overrides:
  zod: 4.4.3

# A fresh install fails on any dependency build script not listed here.
# koffi (through DSH's dsh-fs-local) loads the binary of its prebuilt
# @koromix/koffi-<platform> optional dependency, so its install script stays off.
# node-pty (through dsh-subprocess-local, mounted only by the PTC tests) loads
# its bundled prebuilds/<platform>-<arch> binary; both packages' scripts only
# rebuild it or fix the macOS spawn-helper mode, so they stay off as well.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  esbuild: true
  koffi: false
  node-pty: false

# DSH publishes every 0.2.x prerelease as one train; releases younger than
# pnpm's minimum age would otherwise block an upgrade to the Host under test.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'

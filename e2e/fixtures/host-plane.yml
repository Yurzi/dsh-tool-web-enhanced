# Overlay for the in-process host boot: drop the rows that serve the browser
# GUI, so the probe binds no port (the default 3080 may be in use). Everything
# behind ctx.web stays exactly as the profile composes it.
- id: web-startup
  disabled: true
- id: webserver
  disabled: true
- id: web-runtime
  disabled: true
# Connection owns carrier-neutral registries; only its optional webServer
# attachment binds HTTP. Keep it for the real fileUploads/sessionController
# services, removing the Web launcher dependency and its config expressions.
- id: connection
  inject: []
  config: {}
- id: modules
  disabled: true
